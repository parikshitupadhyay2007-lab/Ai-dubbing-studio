
name: ai_dubbing_studio
description: OtakuDub Offline V5 - Your Anime. Your Language.
publish_to: none
version: 0.5.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^10.3.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/otakudub_icon.png
  adaptive_icon_background: "#FFFAF5"
  adaptive_icon_foreground: assets/otakudub_icon.png
