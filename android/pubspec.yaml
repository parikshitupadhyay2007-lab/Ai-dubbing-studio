name: ai_dubbing_studio
description: OtakuDub - Your Anime. Your Language.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.3.0
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/otakudub_icon.png"
  adaptive_icon_background: "#050509"
  adaptive_icon_foreground: "assets/otakudub_icon.png"
