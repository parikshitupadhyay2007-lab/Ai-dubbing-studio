name: ai_dubbing_studio
description: OtakuDub clean Android foundation
publish_to: none
version: 0.5.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/otakudub_icon.png
  adaptive_icon_background: "#B9A2F4"
  adaptive_icon_foreground: assets/otakudub_icon.png
