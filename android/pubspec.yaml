name: ai_dubbing_studio
description: OtakuDub clean Android foundation
publish_to: none
version: 0.5.1+1006

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  crypto: ^3.0.6
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/manifest.json
    - assets/models/dinov2_small_cls.onnx

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/otakudub_icon.png
  adaptive_icon_background: "#B9A2F4"
  adaptive_icon_foreground: assets/otakudub_icon.png
