name: Recovery quality gate

on:
  push:
    branches:
      - 'recovery/**'
  pull_request:
    paths:
      - 'android/lib/**'
      - 'android/test/**'
      - '.github/workflows/recovery-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: android
        run: flutter pub get
      - name: Analyze
        working-directory: android
        run: flutter analyze
      - name: Run regression tests
        working-directory: android
        run: flutter test
      - name: Produce professional readiness report (non-certifying)
        run: python3 .github/scripts/professional-readiness.py --output professional-readiness.json
      - name: Upload professional readiness report
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Professional-Readiness
          path: professional-readiness.json
          if-no-files-found: error
