name: Build OtakuDub Offline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            android/pubspec.yaml \
            android/lib/main.dart \
            android/assets/otakudub_icon.png \
            android/android/app/build.gradle.kts \
            android/android/app/src/main/kotlin/co/parikshit/otakudub/MainActivity.kt \
            android/android/app/src/main/cpp/CMakeLists.txt \
            android/android/app/src/main/cpp/otakudub_jni.cpp
          do
            test -f "$file" || {
              echo "::error::Missing $file"
              exit 1
            }
          done

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Generate Android platform safely
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          BACKUP="$(mktemp -d)"

          cp -a android/app/src/main/kotlin "$BACKUP/kotlin"
          cp -a android/app/src/main/cpp "$BACKUP/cpp"
          cp android/app/build.gradle.kts "$BACKUP/build.gradle.kts"

          flutter create --platforms=android \
            --org co.parikshit \
            .

          mkdir -p android/app/src/main

          rm -rf android/app/src/main/kotlin
          rm -rf android/app/src/main/cpp

          cp -a "$BACKUP/kotlin" android/app/src/main/kotlin
          cp -a "$BACKUP/cpp" android/app/src/main/cpp
          cp "$BACKUP/build.gradle.kts" android/app/build.gradle.kts

          test -f android/app/src/main/AndroidManifest.xml

      - name: Install pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          DEST="android/android/app/src/main/cpp/llama.cpp"

          rm -rf "$DEST"

          git clone \
            --depth 1 \
            --branch b6500 \
            https://github.com/ggml-org/llama.cpp.git \
            "$DEST"

          test -f "$DEST/CMakeLists.txt"
          test -f "$DEST/include/llama.h"

          echo "Pinned llama.cpp revision:"
          git -C "$DEST" rev-parse HEAD

      - name: Verify native API compatibility
        shell: bash
        run: |
          set -euo pipefail

          HEADER="android/android/app/src/main/cpp/llama.cpp/include/llama.h"
          SOURCE="android/android/app/src/main/cpp/otakudub_jni.cpp"

          test -s "$HEADER"
          test -s "$SOURCE"

          for symbol in \
            llama_model_load_from_file \
            llama_model_get_vocab \
            llama_tokenize \
            llama_decode \
            llama_sampler_sample \
            llama_sampler_accept \
            llama_sampler_free
          do
            if ! grep -q "$symbol" "$HEADER"; then
              echo "::error::Missing llama.cpp API: $symbol"
              exit 1
            fi
          done

      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: android
        run: dart run flutter_launcher_icons

      - name: Configure Japanese branding
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="オタクダブ"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Android label not found")

          manifest.write_text(content)
          PY

      - name: Verify Flutter and native files
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          flutter --version

          test -f android/app/build.gradle.kts
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -f android/app/src/main/cpp/otakudub_jni.cpp
          test -f android/app/src/main/cpp/llama.cpp/CMakeLists.txt

      - name: Build OtakuDub APK
        working-directory: android
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Offline-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
