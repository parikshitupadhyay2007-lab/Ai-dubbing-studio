name: Build OtakuDub Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            android/pubspec.yaml \
            android/lib/main.dart \
            android/assets/otakudub_icon.png \
            android/assets/models/README.md \
            android/android/app/build.gradle.kts \
            android/android/app/src/main/kotlin/co/parikshit/otakudub/MainActivity.kt \
            android/android/app/src/main/kotlin/co/parikshit/otakudub/OfflineAudioUtils.kt \
            android/android/app/src/main/cpp/CMakeLists.txt \
            android/android/app/src/main/cpp/otakudub_jni.cpp \
            android/android/app/src/main/cpp/otakudub_whisper.cpp
          do
            test -f "$file" || {
              echo "::error::Missing $file"
              exit 1
            }
          done

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Generate Android platform safely
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          BACKUP="$(mktemp -d)"

          cp -a android/app/src/main/kotlin "$BACKUP/kotlin"
          cp -a android/app/src/main/cpp "$BACKUP/cpp"
          cp android/app/build.gradle.kts "$BACKUP/build.gradle.kts"

          flutter create \
            --platforms=android \
            --org co.parikshit \
            .

          mkdir -p android/app/src/main

          rm -rf android/app/src/main/kotlin
          rm -rf android/app/src/main/cpp

          cp -a "$BACKUP/kotlin" android/app/src/main/kotlin
          cp -a "$BACKUP/cpp" android/app/src/main/cpp
          cp "$BACKUP/build.gradle.kts" android/app/build.gradle.kts

          test -f android/app/src/main/AndroidManifest.xml

      - name: Install pinned native AI sources
        shell: bash
        run: |
          set -euo pipefail

          CPP="android/android/app/src/main/cpp"

          rm -rf "$CPP/llama.cpp"
          rm -rf "$CPP/whisper.cpp"

          git clone \
            --depth 1 \
            --branch b6500 \
            https://github.com/ggml-org/llama.cpp.git \
            "$CPP/llama.cpp"

          git clone \
            --depth 1 \
            --branch v1.7.6 \
            https://github.com/ggml-org/whisper.cpp.git \
            "$CPP/whisper.cpp"

          test -f "$CPP/llama.cpp/include/llama.h"
          test -f "$CPP/whisper.cpp/include/whisper.h"

          echo "===== LLAMA REVISION ====="
          git -C "$CPP/llama.cpp" rev-parse HEAD

          echo "===== WHISPER REVISION ====="
          git -C "$CPP/whisper.cpp" rev-parse HEAD

      - name: Verify native source interfaces
        shell: bash
        run: |
          set -euo pipefail

          CPP="android/android/app/src/main/cpp"

          for symbol in \
            llama_model_load_from_file \
            llama_model_get_vocab \
            llama_tokenize \
            llama_decode \
            llama_sampler_sample
          do
            grep -q "$symbol" "$CPP/llama.cpp/include/llama.h" || {
              echo "::error::Missing llama API: $symbol"
              exit 1
            }
          done

          for symbol in \
            whisper_init_from_file_with_params \
            whisper_full \
            whisper_full_n_segments \
            whisper_full_get_segment_text
          do
            grep -q "$symbol" "$CPP/whisper.cpp/include/whisper.h" || {
              echo "::error::Missing Whisper API: $symbol"
              exit 1
            }
          done

      - name: Download bundled Whisper model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="android/assets/models"
          mkdir -p "$MODEL_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --output "$MODEL_DIR/whisper.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"

          echo "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  $MODEL_DIR/whisper.bin" \
            | sha256sum --check --status

          test "$(stat -c%s "$MODEL_DIR/whisper.bin")" -eq 147951465

          echo "Whisper model downloaded and verified."

      
      
      - name: Download bundled OtakuMind model
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade huggingface_hub
          mkdir -p android/assets/models

          python3 - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          import shutil

          repo = "tensorblock/Qwen_Qwen3-0.6B-GGUF"
          files = HfApi().list_repo_files(repo)
          print("AVAILABLE MODEL FILES:", files, flush=True)
          matches = [
              name for name in files
              if Path(name).name == "Qwen3-0.6B-Q3_K_M.gguf"
              ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one Q3_K_M model; found: {matches}"
              )

          print(f"Downloading: {matches[0]}")

          source = hf_hub_download(
              repo_id=repo,
              filename=matches[0],
          )

          destination = Path(
              "android/assets/models/otakumind.gguf"
          )
          shutil.copyfile(source, destination)

          size = destination.stat().st_size
          if size < 400_000_000:
              raise SystemExit("Incomplete model download")

          with destination.open("rb") as file:
              if file.read(4) != b"GGUF":
                  raise SystemExit("Invalid GGUF header")

          print(f"OtakuMind ready: {size:,} bytes")
          PY


      # Supports a dynamic ONNX batch dimension; native inference uses batch 1.
      - name: Bundle pinned instrumental ONNX checkpoint
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="android/assets/models"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$MODEL_DIR/separation.onnx" \
            "https://huggingface.co/Politrees/UVR_resources/resolve/0472e5cd4e0f77b95ca2df7a8162992e6799fa49/MDXNet_models/UVR-MDX-NET-Inst_HQ_3.onnx"
          echo "317554b07fe1ea5279a77f2b1520a41ea4b93432560c4ffd08792c30fddf9adc  $MODEL_DIR/separation.onnx" | sha256sum --check
          python3 -m pip install 'onnx>=1.16,<2'
          python3 - <<'PY'
          import json
          import onnx
          from pathlib import Path
          path = Path("android/assets/models/separation.onnx")
          model = onnx.load(str(path), load_external_data=False)
          graph = model.graph
          initializers = {i.name for i in graph.initializer}
          inputs = [x for x in graph.input if x.name not in initializers]
          outputs = list(graph.output)
          def shape(node):
              return [dim.dim_value if dim.HasField("dim_value") else -1
                      for dim in node.type.tensor_type.shape.dim]
          if len(inputs) != 1 or len(outputs) != 1 or shape(inputs[0]) != [-1,4,3072,256] or shape(outputs[0]) != [-1,4,3072,256]:
              raise SystemExit(f"Unexpected model I/O: {[(x.name,shape(x)) for x in inputs]} -> {[(x.name,shape(x)) for x in outputs]}")
          manifest = dict(model_id="UVR-MDX-NET-Inst_HQ_3",
              stem="instrumental",
              sha256="317554b07fe1ea5279a77f2b1520a41ea4b93432560c4ffd08792c30fddf9adc",
              input_name=inputs[0].name, output_name=outputs[0].name)
          Path("android/assets/models/separation.json").write_text(json.dumps(manifest, indent=2))
          print("Validated separation tensor metadata and wrote bundled manifest.")
          PY

      - name: Bundle verified Hindi and English Piper voices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/assets/models/voices
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/"
          voices = [
            ("hi_hero", "hi/hi_IN/pratham/medium/hi_IN-pratham-medium",
             "169964b0871667f6793416d4b35e97357a68ba1ad01df8580c28048989ee7693", "hi"),
            ("en_hero", "en/en_US/lessac/medium/en_US-lessac-medium",
             "5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f", "en"),
          ]
          target = Path("android/assets/models/voices")
          for profile, remote, digest, language in voices:
              for suffix in (".onnx", ".onnx.json"):
                  path = target / (profile + suffix)
                  urllib.request.urlretrieve(base + remote + suffix, path)
                  if not path.is_file() or not path.stat().st_size:
                      raise SystemExit("Missing voice asset: " + str(path))
              model = target / (profile + ".onnx")
              actual = hashlib.sha256(model.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"Checksum mismatch for {profile}: {actual}")
              config = json.loads((target / (profile + ".onnx.json")).read_text())
              if config["language"]["code"].split("_")[0] != language:
                  raise SystemExit("Voice language mismatch: " + profile)
              if not config.get("phoneme_id_map") or config.get("num_speakers") != 1:
                  raise SystemExit("Unsupported Piper configuration: " + profile)
              print(profile, "verified:", model.stat().st_size, "bytes")
          PY

      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get

      # Blackheart identity artwork is generated from original geometry, not copied branding.
      # Rebuild includes the restored five-second company and app introduction.
      # Validate the new stage-based video percentage and clarified engine library.
      - name: Create Blackheart OtakuDub launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow>=10,<13'
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          im = Image.new('RGB', (1024, 1024), (185, 162, 244))
          draw = ImageDraw.Draw(im)
          font_file = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for label, top, size in [('Otaku', 310, 180), ('Dub', 505, 220)]:
              font = ImageFont.truetype(font_file, size)
              width = draw.textlength(label, font=font)
              draw.text(((1024-width)/2, top), label, font=font, fill='white')
          draw.polygon([(785,220),(800,265),(845,280),(800,295),
                        (785,340),(770,295),(725,280),(770,265)], fill='white')
          path = Path('android/assets/otakudub_icon.png')
          im.save(path)
          # Adaptive icons need a transparent foreground and a separately
          # configured lavender background; keep artwork in the safe zone.
          foreground = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          foreground_draw = ImageDraw.Draw(foreground)
          for label, top, size in [('Otaku', 360, 125), ('Dub', 495, 155)]:
              font = ImageFont.truetype(font_file, size)
              width = foreground_draw.textlength(label, font=font)
              foreground_draw.text(((1024-width)/2, top), label, font=font, fill='white')
          foreground_draw.polygon([(700,335),(710,365),(740,375),(710,385),
                                   (700,415),(690,385),(660,375),(690,365)],fill='white')
          foreground_path = Path('android/assets/otakudub_icon_foreground.png')
          foreground.save(foreground_path)
          print('Lavender launcher icons ready:', path.stat().st_size, foreground_path.stat().st_size)
          PY

      - name: Generate launcher icon
        working-directory: android
        run: dart run flutter_launcher_icons

      - name: Verify custom launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          test -s android/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/android/app/src/main/AndroidManifest.xml

      - name: Configure Japanese branding
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Otaku Dub"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Android app label not found")

          manifest.write_text(content)
          PY

      - name: Verify Flutter installation
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

          test -s assets/models/whisper.bin

      - name: Run Flutter regression tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # flutter create generates a template test for MyApp, but OtakuDub
          # has its own app root and checked-in regression tests.
          if test -f test/widget_test.dart && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          flutter test

      - name: Build OtakuDub APK
        working-directory: android
        run: flutter build apk --debug

      - name: Verify every required AI asset inside the built APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json
          apk = Path("android/build/app/outputs/flutter-apk/app-debug.apk")
          required = {
              "assets/flutter_assets/assets/models/whisper.bin": 147951465,
              "assets/flutter_assets/assets/models/otakumind.gguf": 400000000,
              "assets/flutter_assets/assets/models/separation.onnx": 1000000,
              "assets/flutter_assets/assets/models/separation.json": 10,
              "assets/flutter_assets/assets/models/voices/hi_hero.onnx": 1000000,
              "assets/flutter_assets/assets/models/voices/hi_hero.onnx.json": 100,
              "assets/flutter_assets/assets/models/voices/en_hero.onnx": 1000000,
              "assets/flutter_assets/assets/models/voices/en_hero.onnx.json": 100,
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for name, minimum in required.items():
                  if name not in names:
                      raise SystemExit("REQUIRED APK ASSET MISSING: " + name)
                  info = archive.getinfo(name)
                  if info.file_size < minimum:
                      raise SystemExit(f"REQUIRED APK ASSET TOO SMALL: {name} ({info.file_size})")
                  with archive.open(name) as stream:
                      header = stream.read(4)
                  if name.endswith(".gguf") and header != b"GGUF":
                      raise SystemExit("Invalid bundled OtakuMind GGUF header")
                  print("VERIFIED:", name, info.file_size, "bytes")
              manifest = json.loads(archive.read("assets/flutter_assets/AssetManifest.json")) if "assets/flutter_assets/AssetManifest.json" in names else None
              print("All required AI assets physically present in APK.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Offline-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# Rebuild: align Engine Library voice indicators with installed Piper registry.
