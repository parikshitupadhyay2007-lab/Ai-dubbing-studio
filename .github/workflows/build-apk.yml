
name: Build OtakuDub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. CHECKOUT REPOSITORY
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. DIAGNOSE PROJECT STRUCTURE
      - name: Diagnose and verify project files
        shell: bash
        run: |
          echo "===== BUILD INFORMATION ====="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Working directory: $(pwd)"

          echo "===== REPOSITORY ROOT ====="
          ls -la

          echo "===== ANDROID DIRECTORY ====="
          if [ -d android ]; then
            ls -la android
          else
            echo "ERROR: android directory missing"
            exit 1
          fi

          echo "===== REQUIRED FILES ====="

          for file in \
            android/pubspec.yaml \
            android/lib/main.dart \
            android/assets/otakudub_icon.png
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

          echo "SUCCESS: All required files found"

      # 3. INSTALL JAVA
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. INSTALL FLUTTER  
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          df -h
          ls -la "$ANDROID_HOME/ndk" || true

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate Android platform
        working-directory: android
        run: flutter create --platforms=android .


      # 5. GENERATE ANDROID PLATFORM FILES
      - name: Generate Android platform files
        working-directory: android
        run: flutter create --platforms=android .

      # 6. INSTALL DEPENDENCIES
      - name: Install dependencies
        working-directory: android
        run: flutter pub get

      # 7. GENERATE OTAKUDUB ICON
      - name: Generate OtakuDub launcher icon
        working-directory: android
        run: dart run flutter_launcher_icons

      # 8. SET ANDROID APP NAME
      - name: Set Android app name
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="OtakuDub"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not update Android app name"
              )

          manifest.write_text(content)
          print("Android launcher name: OtakuDub")
          PY

      # 9. CONFIGURE ANDROID SDK 36
      - name: Configure Android SDK 36
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle.kts")
          content = app.read_text()

          content, count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=\s*[^\r\n]+',
              r'\g<1>compileSdk = 36',
              content
          )

          if count != 1:
              raise SystemExit(
                  "Could not configure app SDK"
              )

          app.write_text(content)
          print("App compileSdk = 36")

          cache = Path.home() / ".pub-cache"

          plugins = list(cache.glob(
              "hosted/pub.dev/file_picker-*/android/build.gradle"
          ))

          if not plugins:
              raise SystemExit(
                  "file_picker Gradle file not found"
              )

          for plugin in plugins:
              content = plugin.read_text()

              pattern = (
                  r'(?m)^(\s*)compileSdk(?:Version)?'
                  r'\s*(?:=\s*|\s+)[^\r\n]+'
              )

              content, count = re.subn(
                  pattern,
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count == 0:
                  content, count = re.subn(
                      r'(?m)^(\s*android\s*\{)',
                      r'\g<1>\n    compileSdkVersion 36',
                      content,
                      count=1
                  )

              if count == 0:
                  raise SystemExit(
                      f"Could not configure plugin: {plugin}"
                  )

              plugin.write_text(content)

              print(f"Updated plugin: {plugin}")

              matches = re.findall(
                  r'(?m)^\s*compileSdk[^\r\n]*',
                  content
              )

              print(
                  "Plugin SDK settings:",
                  matches
              )
          PY

      # 10. BUILD APK
      - name: Build OtakuDub APK
        working-directory: android
        run: flutter build apk --debug

      # 11. UPLOAD APK
      - name: Upload OtakuDub APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
