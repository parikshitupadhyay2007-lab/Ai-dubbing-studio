  
name: Build OtakuDub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # =====================================
      # 1. CHECKOUT REPOSITORY
      # =====================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================
      # 2. VERIFY PROJECT STRUCTURE
      # =====================================

      - name: Verify OtakuDub project files
        shell: bash
        run: |
          set -e

          echo "===== BUILD INFORMATION ====="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Working directory: $(pwd)"

          echo "===== REPOSITORY ROOT ====="
          ls -la

          echo "===== REQUIRED FILES ====="

          for file in \
            android/pubspec.yaml \
            android/lib/main.dart \
            android/assets/otakudub_icon.png
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

          echo "OtakuDub project structure verified."

      # =====================================
      # 3. INSTALL JAVA
      # =====================================

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================================
      # 4. INSTALL FLUTTER
      # =====================================

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =====================================
      # 5. PREPARE ANDROID SDK
      # =====================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # =====================================
      # 6. GENERATE ANDROID PLATFORM
      # =====================================

      - name: Generate Android platform
        working-directory: android
        shell: bash
        run: |
          set -e

          flutter create --platforms=android .

          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android platform generated successfully."

      # =====================================
      # 7. INSTALL FLUTTER DEPENDENCIES
      # =====================================

      - name: Install dependencies
        working-directory: android
        run: flutter pub get

      # =====================================
      # 8. GENERATE OTAKUDUB ICON
      # =====================================

      - name: Generate OtakuDub launcher icon
        working-directory: android
        run: dart run flutter_launcher_icons

      # =====================================
      # 9. SET ANDROID APP NAME
      # =====================================

      - name: Configure OtakuDub app name
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="オタクダブ"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not configure Android app name."
              )

          manifest.write_text(content)

          print("App name configured: オタクダブ")
          PY

      # =====================================
      # 10. CONFIGURE ANDROID SDK 36
      # =====================================

      - name: Configure Android SDK 36
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle.kts")

          content = app.read_text()

          content, count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=\s*[^\r\n]+',
              r'\g<1>compileSdk = 36',
              content
          )

          if count != 1:
              raise SystemExit(
                  "Could not configure app compileSdk."
              )

          app.write_text(content)

          print("App compileSdk = 36")

          cache = Path.home() / ".pub-cache"

          plugins = list(
              cache.glob(
                  "hosted/pub.dev/file_picker-*/android/build.gradle"
              )
          )

          for plugin in plugins:
              content = plugin.read_text()

              pattern = (
                  r'(?m)^(\s*)compileSdk(?:Version)?'
                  r'\s*(?:=\s*|\s+)[^\r\n]+'
              )

              content, count = re.subn(
                  pattern,
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count == 0:
                  content, count = re.subn(
                      r'(?m)^(\s*android\s*\{)',
                      r'\g<1>\n    compileSdkVersion 36',
                      content,
                      count=1
                  )

              if count == 0:
                  raise SystemExit(
                      f"Could not configure plugin: {plugin}"
                  )

              plugin.write_text(content)

              print(f"Updated plugin: {plugin}")

          PY

      # =====================================
      # 11. VERIFY FLUTTER PROJECT
      # =====================================

      - name: Verify Flutter installation
        working-directory: android
        shell: bash
        run: |
          flutter --version
          flutter pub get

      # =====================================
      # 12. BUILD OTAKUDUB APK
      # =====================================

      - name: Build OtakuDub APK
        working-directory: android
        run: flutter build apk --debug

      # =====================================
      # 13. UPLOAD APK
      # =====================================

      - name: Upload OtakuDub APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Offline-V4-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
    
