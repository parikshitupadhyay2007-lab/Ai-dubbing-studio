name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify uploaded files
        run: |
          ls -la
          ls -la android
          test -f android/pubspec.yaml
          test -f android/lib/main.dart

      - name: Generate Android platform files
        run: |
          cd android
          flutter create --platforms=android .
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter.compileSdkVersion/compileSdk = 36/; s/compileSdk[[:space:]]+flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle.kts


      - name: Install dependencies
        run: |
          cd android
          flutter pub get

      - name: Build debug APK
        run: |
          cd android
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dubbing-Studio-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
