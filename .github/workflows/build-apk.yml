name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify uploaded files
        run: |
          test -f android/pubspec.yaml
          test -f android/lib/main.dart
          echo "Flutter project files found."

      - name: Generate Android platform files
        working-directory: android
        run: flutter create --platforms=android .

      - name: Configure Android SDK 36
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          content = path.read_text()

          content, count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=\s*[^\r\n]+',
              r'\g<1>compileSdk = 36',
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected one compileSdk setting, found {count}"
              )

          path.write_text(content)
          print("Android compileSdk successfully set to 36")
          PY

          grep -n 'compileSdk' android/app/build.gradle.kts

      - name: Install dependencies
        working-directory: android
        run: flutter pub get

      - name: Configure file picker SDK
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache"
          files = list(pub_cache.glob(
              "hosted/pub.dev/file_picker-*/android/build.gradle"
          ))

          if not files:
              raise SystemExit("file_picker Gradle file not found")

          for path in files:
              content = path.read_text()
              content, count = re.subn(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 36',
                  content
              )

              if count == 0:
                  content, count = re.subn(
                      r'compileSdk\s*=\s*\d+',
                      'compileSdk = 36',
                      content
                  )

              if count == 0:
                  raise SystemExit(
                      f"Could not update compileSdk in {path}"
                  )

              path.write_text(content)
              print(f"Updated {path} to SDK 36")
          PY

      - name: Build debug APK
        working-directory: android
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dubbing-Studio-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

