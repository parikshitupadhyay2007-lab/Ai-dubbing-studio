name: Build OtakuDub Offline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            android/pubspec.yaml \
            android/lib/main.dart \
            android/assets/otakudub_icon.png \
            android/assets/models/README.md \
            android/android/app/build.gradle.kts \
            android/android/app/src/main/kotlin/co/parikshit/otakudub/MainActivity.kt \
            android/android/app/src/main/kotlin/co/parikshit/otakudub/OfflineAudioUtils.kt \
            android/android/app/src/main/cpp/CMakeLists.txt \
            android/android/app/src/main/cpp/otakudub_jni.cpp \
            android/android/app/src/main/cpp/otakudub_whisper.cpp
          do
            test -f "$file" || {
              echo "::error::Missing $file"
              exit 1
            }
          done

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Generate Android platform safely
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          BACKUP="$(mktemp -d)"

          cp -a android/app/src/main/kotlin "$BACKUP/kotlin"
          cp -a android/app/src/main/cpp "$BACKUP/cpp"
          cp android/app/build.gradle.kts "$BACKUP/build.gradle.kts"

          flutter create \
            --platforms=android \
            --org co.parikshit \
            .

          mkdir -p android/app/src/main

          rm -rf android/app/src/main/kotlin
          rm -rf android/app/src/main/cpp

          cp -a "$BACKUP/kotlin" android/app/src/main/kotlin
          cp -a "$BACKUP/cpp" android/app/src/main/cpp
          cp "$BACKUP/build.gradle.kts" android/app/build.gradle.kts

          test -f android/app/src/main/AndroidManifest.xml

      - name: Install pinned native AI sources
        shell: bash
        run: |
          set -euo pipefail

          CPP="android/android/app/src/main/cpp"

          rm -rf "$CPP/llama.cpp"
          rm -rf "$CPP/whisper.cpp"

          git clone \
            --depth 1 \
            --branch b6500 \
            https://github.com/ggml-org/llama.cpp.git \
            "$CPP/llama.cpp"

          git clone \
            --depth 1 \
            --branch v1.7.6 \
            https://github.com/ggml-org/whisper.cpp.git \
            "$CPP/whisper.cpp"

          test -f "$CPP/llama.cpp/include/llama.h"
          test -f "$CPP/whisper.cpp/include/whisper.h"

          echo "===== LLAMA REVISION ====="
          git -C "$CPP/llama.cpp" rev-parse HEAD

          echo "===== WHISPER REVISION ====="
          git -C "$CPP/whisper.cpp" rev-parse HEAD

      - name: Verify native source interfaces
        shell: bash
        run: |
          set -euo pipefail

          CPP="android/android/app/src/main/cpp"

          for symbol in \
            llama_model_load_from_file \
            llama_model_get_vocab \
            llama_tokenize \
            llama_decode \
            llama_sampler_sample
          do
            grep -q "$symbol" "$CPP/llama.cpp/include/llama.h" || {
              echo "::error::Missing llama API: $symbol"
              exit 1
            }
          done

          for symbol in \
            whisper_init_from_file_with_params \
            whisper_full \
            whisper_full_n_segments \
            whisper_full_get_segment_text
          do
            grep -q "$symbol" "$CPP/whisper.cpp/include/whisper.h" || {
              echo "::error::Missing Whisper API: $symbol"
              exit 1
            }
          done

      - name: Download bundled Whisper model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="android/assets/models"
          mkdir -p "$MODEL_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --output "$MODEL_DIR/whisper.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"

          echo "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  $MODEL_DIR/whisper.bin" \
            | sha256sum --check --status

          test "$(stat -c%s "$MODEL_DIR/whisper.bin")" -eq 147951465

          echo "Whisper model downloaded and verified."

      - name: Download bundled OtakuMind model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="android/assets/models"
          mkdir -p "$MODEL_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --output "$MODEL_DIR/otakumind.gguf" \
            "https://huggingface.co/tensorblock/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf"

          python3 - <<'PY'
          from pathlib import Path

          model = Path("android/assets/models/otakumind.gguf")

          if model.stat().st_size < 400_000_000:
              raise SystemExit("OtakuMind model download is incomplete")

          with model.open("rb") as file:
              if file.read(4) != b"GGUF":
                  raise SystemExit("Invalid OtakuMind GGUF header")

          print("OtakuMind model downloaded and checked.")
          PY

      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: android
        run: dart run flutter_launcher_icons

      - name: Configure Japanese branding
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="オタクダブ"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Android app label not found")

          manifest.write_text(content)
          PY

      - name: Verify Flutter installation
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

          test -s assets/models/whisper.bin

      - name: Build OtakuDub APK
        working-directory: android
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Offline-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
