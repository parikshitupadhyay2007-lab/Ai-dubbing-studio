
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify project files
        run: |
          test -f android/pubspec.yaml
          test -f android/lib/main.dart
          echo "Flutter project files found"

      - name: Generate Android platform files
        working-directory: android
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: android
        run: flutter pub get

      - name: Configure Android SDK 36
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle.kts")
          content = app.read_text()

          content, count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=\s*[^\r\n]+',
              r'\g<1>compileSdk = 36',
              content
          )

          if count != 1:
              raise SystemExit("Could not configure app SDK")

          app.write_text(content)
          print("App compileSdk = 36")

          cache = Path.home() / ".pub-cache"
          plugins = list(cache.glob(
              "hosted/pub.dev/file_picker-*/android/build.gradle"
          ))

          if not plugins:
              raise SystemExit("file_picker Gradle file not found")

          for plugin in plugins:
              content = plugin.read_text()

              pattern = (
                  r'(?m)^(\s*)compileSdk(?:Version)?'
                  r'\s*(?:=\s*|\s+)[^\r\n]+'
              )

              content, count = re.subn(
                  pattern,
                  r'\g<1>compileSdkVersion 36',
                  content
              )

              if count == 0:
                  content, count = re.subn(
                      r'(?m)^(\s*android\s*\{)',
                      r'\g<1>\n    compileSdkVersion 36',
                      content,
                      count=1
                  )

              if count == 0:
                  raise SystemExit(
                      f"Could not configure plugin: {plugin}"
                  )

              plugin.write_text(content)
              print(f"Updated plugin: {plugin}")

              matches = re.findall(
                  r'(?m)^\s*compileSdk[^\r\n]*',
                  content
              )
              print("Plugin SDK settings:", matches)

          PY

      - name: Build debug APK
        working-directory: android
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dubbing-Studio-APK
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

