name: Build OtakuDub Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/departmental-ai-pipeline]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
      - 'tools/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test bilingual translation evaluation
        shell: bash
        run: python3 -m unittest discover -s tools -p 'test_evaluate_translation.py' -v

      - name: Test speaker identity evaluation
        shell: bash
        run: python3 -m unittest discover -s tools -p 'test_evaluate_speaker_diarization.py' -v

      - name: Test speaker model release qualification
        shell: bash
        run: python3 -m unittest discover -s tools -p 'test_verify_speaker_model_release.py' -v

      - name: Test trained expressive TTS reference plan
        run: |
          python3 -m unittest discover -s tools -p 'test_render_supertonic3_reference.py' -v
          python3 -m unittest discover -s tools -p 'test_prepare_supertonic3_assets.py' -v

      - name: Test training-data acquisition safety contracts
        shell: bash
        run: python3 -m unittest discover -s tools -p 'test_acquire_training_data.py' -v

      - name: Test OtakuMind anime evidence and benchmark contracts
        shell: bash
        run: python3 -m unittest discover -s tools -p 'test_anime_evidence.py' -v

      - name: Test engine coordination and handoff contracts
        shell: bash
        run: python3 -m unittest discover -s tools -p 'test_engine_coordination.py' -v

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            android/pubspec.yaml \
            android/lib/main.dart \
            android/assets/otakudub_icon.png \
            android/assets/models/README.md \
            android/android/app/build.gradle.kts \
            android/android/app/src/main/kotlin/co/parikshit/otakudub/MainActivity.kt \
            android/android/app/src/main/kotlin/co/parikshit/otakudub/OfflineAudioUtils.kt \
            android/android/app/src/main/cpp/CMakeLists.txt \
            android/android/app/src/main/cpp/otakudub_jni.cpp \
            android/android/app/src/main/cpp/otakudub_whisper.cpp
          do
            test -f "$file" || {
              echo "::error::Missing $file"
              exit 1
            }
          done

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fail fast on Flutter source errors
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --fatal-infos lib/services/offline_engine.dart lib/services/voice_catalog.dart

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Generate Android platform safely
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          BACKUP="$(mktemp -d)"

          cp -a android/app/src/main/kotlin "$BACKUP/kotlin"
          cp -a android/app/src/main/java "$BACKUP/java"
          cp -a android/app/src/main/assets "$BACKUP/native_assets"
          cp -a android/app/src/main/cpp "$BACKUP/cpp"
          cp android/app/build.gradle.kts "$BACKUP/build.gradle.kts"

          flutter create \
            --platforms=android \
            --org co.parikshit \
            .

          mkdir -p android/app/src/main

          rm -rf android/app/src/main/kotlin
          rm -rf android/app/src/main/java
          rm -rf android/app/src/main/assets
          rm -rf android/app/src/main/cpp

          cp -a "$BACKUP/kotlin" android/app/src/main/kotlin
          cp -a "$BACKUP/java" android/app/src/main/java
          cp -a "$BACKUP/native_assets" android/app/src/main/assets
          cp -a "$BACKUP/cpp" android/app/src/main/cpp
          cp "$BACKUP/build.gradle.kts" android/app/build.gradle.kts

          test -f android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/co/parikshit/otakudub/SupertonicReference.java
          test -s android/app/src/main/assets/SUPERTONIC_JAVA_NOTICE.txt

      - name: Install pinned native AI sources
        shell: bash
        run: |
          set -euo pipefail

          CPP="android/android/app/src/main/cpp"

          rm -rf "$CPP/llama.cpp"
          rm -rf "$CPP/whisper.cpp"

          git clone \
            --depth 1 \
            --branch b6500 \
            https://github.com/ggml-org/llama.cpp.git \
            "$CPP/llama.cpp"

          git clone \
            --depth 1 \
            --branch v1.7.6 \
            https://github.com/ggml-org/whisper.cpp.git \
            "$CPP/whisper.cpp"

          test -f "$CPP/llama.cpp/include/llama.h"
          test -f "$CPP/whisper.cpp/include/whisper.h"

          echo "===== LLAMA REVISION ====="
          git -C "$CPP/llama.cpp" rev-parse HEAD

          echo "===== WHISPER REVISION ====="
          git -C "$CPP/whisper.cpp" rev-parse HEAD

      - name: Guard Qwen3 offline final-answer generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native = Path("android/android/app/src/main/cpp/otakudub_jni.cpp").read_text()
          required = (
              'templateText.find("enable_thinking")',
              'prompt += "<think>\\n\\n</think>\\n\\n";',
              'llama_memory_clear(',
              'llama_sampler_init_penalties(',
              'Model ended generation without spoken text.',
              'Native token decoding failed.',
          )
          for item in required:
              if item not in native:
                  raise SystemExit("Missing critical Qwen3 inference safety: " + item)
          print("Native Qwen3 final-answer and termination safeguards present")
          PY

      - name: Verify native source interfaces
        shell: bash
        run: |
          set -euo pipefail

          CPP="android/android/app/src/main/cpp"

          for symbol in \
            llama_model_load_from_file \
            llama_model_get_vocab \
            llama_tokenize \
            llama_decode \
            llama_sampler_sample \
            llama_model_chat_template \
            llama_chat_apply_template
          do
            grep -q "$symbol" "$CPP/llama.cpp/include/llama.h" || {
              echo "::error::Missing llama API: $symbol"
              exit 1
            }
          done

          for symbol in \
            whisper_init_from_file_with_params \
            whisper_full \
            whisper_full_n_segments \
            whisper_full_get_segment_text
          do
            grep -q "$symbol" "$CPP/whisper.cpp/include/whisper.h" || {
              echo "::error::Missing Whisper API: $symbol"
              exit 1
            }
          done

      - name: Download bundled Whisper model
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="android/assets/models"
          mkdir -p "$MODEL_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --output "$MODEL_DIR/whisper.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin"

          echo "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  $MODEL_DIR/whisper.bin" \
            | sha256sum --check --status

          test "$(stat -c%s "$MODEL_DIR/whisper.bin")" -ge 550000000
          python3 - <<'PY'
          from pathlib import Path
          model = Path("android/assets/models/whisper.bin")
          header = model.open("rb").read(4)
          if header != bytes.fromhex("6c6d6767"):
              raise SystemExit(f"Unexpected Whisper ggml magic: {header.hex()}")
          manager = Path("android/lib/services/model_manager.dart").read_text()
          for check in ("header[0] == 0x6c", "header[1] == 0x6d", "header[2] == 0x67", "header[3] == 0x67"):
              if check not in manager:
                  raise SystemExit("Whisper validator disagrees with bundled model: " + check)
          print("Whisper header and Dart validator agree.")
          PY

          echo "Whisper model downloaded and verified."

      
      
      - name: Download bundled OtakuMind model
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade huggingface_hub
          mkdir -p android/assets/models

          python3 - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          import shutil

          repo = "Mungert/Qwen3-1.7B-GGUF"
          files = HfApi().list_repo_files(repo)
          print("AVAILABLE MODEL FILES:", files, flush=True)
          matches = [
              name for name in files
              if Path(name).name == "Qwen3-1.7B-q4_k_m.gguf"
              ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one Q4_K_M model; found: {matches}"
              )

          print(f"Downloading: {matches[0]}")

          source = hf_hub_download(
              repo_id=repo,
              filename=matches[0],
          )

          destination = Path(
              "android/assets/models/otakumind.gguf"
          )
          shutil.copyfile(source, destination)

          size = destination.stat().st_size
          if size < 1_200_000_000:
              raise SystemExit("Incomplete model download")

          with destination.open("rb") as file:
              if file.read(4) != b"GGUF":
                  raise SystemExit("Invalid GGUF header")

          print(f"OtakuMind ready: {size:,} bytes")
          PY


      # Supports a dynamic ONNX batch dimension; native inference uses batch 1.
      - name: Bundle pinned instrumental ONNX checkpoint
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="android/assets/models"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$MODEL_DIR/separation.onnx" \
            "https://huggingface.co/Politrees/UVR_resources/resolve/0472e5cd4e0f77b95ca2df7a8162992e6799fa49/MDXNet_models/UVR-MDX-NET-Inst_HQ_3.onnx"
          echo "317554b07fe1ea5279a77f2b1520a41ea4b93432560c4ffd08792c30fddf9adc  $MODEL_DIR/separation.onnx" | sha256sum --check
          python3 -m pip install 'onnx>=1.16,<2' 'onnxruntime>=1.19,<2'
          python3 - <<'PY'
          import json
          import onnx
          from pathlib import Path
          path = Path("android/assets/models/separation.onnx")
          model = onnx.load(str(path), load_external_data=False)
          graph = model.graph
          initializers = {i.name for i in graph.initializer}
          inputs = [x for x in graph.input if x.name not in initializers]
          outputs = list(graph.output)
          def shape(node):
              return [dim.dim_value if dim.HasField("dim_value") else -1
                      for dim in node.type.tensor_type.shape.dim]
          if len(inputs) != 1 or len(outputs) != 1 or shape(inputs[0]) != [-1,4,3072,256] or shape(outputs[0]) != [-1,4,3072,256]:
              raise SystemExit(f"Unexpected model I/O: {[(x.name,shape(x)) for x in inputs]} -> {[(x.name,shape(x)) for x in outputs]}")
          manifest = dict(model_id="UVR-MDX-NET-Inst_HQ_3",
              stem="instrumental",
              sha256="317554b07fe1ea5279a77f2b1520a41ea4b93432560c4ffd08792c30fddf9adc",
              input_name=inputs[0].name, output_name=outputs[0].name)
          Path("android/assets/models/separation.json").write_text(json.dumps(manifest, indent=2))
          print("Validated separation tensor metadata and wrote bundled manifest.")
          PY

      - name: Bundle verified Hindi and English Piper voices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/assets/models/voices
          python3 - <<'PY'
          import hashlib, json, urllib.request, urllib.error, time
          from pathlib import Path
          base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/"
          def download(url, path):
              for attempt in range(5):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "OtakuDub-CI/1.0"})
                      with urllib.request.urlopen(request, timeout=120) as response, path.open("wb") as output:
                          import shutil
                          shutil.copyfileobj(response, output)
                      if path.stat().st_size == 0:
                          raise OSError("Downloaded voice is empty")
                      return
                  except (OSError, urllib.error.URLError):
                      path.unlink(missing_ok=True)
                      if attempt == 4:
                          raise
                      time.sleep(min(2 ** attempt, 16))
          voices = [
            ("hi_hero", "hi/hi_IN/pratham/medium/hi_IN-pratham-medium",
             "169964b0871667f6793416d4b35e97357a68ba1ad01df8580c28048989ee7693", "hi"),
            ("en_hero", "en/en_US/lessac/high/en_US-lessac-high",
             "99d1f6181a7f5ccbe3f117ba8ce63c93", "en"),
            ("hi_heroine", "hi/hi_IN/priyamvada/medium/hi_IN-priyamvada-medium",
             "7d5e20c2d1e72de8ed772f222e679626", "hi"),
            ("en_young_male", "en/en_US/hfc_male/medium/en_US-hfc_male-medium",
             "cd2fda1933f0653d3ddc85e5f30ebdd2", "en"),
          ]
          target = Path("android/assets/models/voices")
          for profile, remote, digest, language in voices:
              for suffix in (".onnx", ".onnx.json"):
                  path = target / (profile + suffix)
                  download(base + remote + suffix, path)
                  if not path.is_file() or not path.stat().st_size:
                      raise SystemExit("Missing voice asset: " + str(path))
              model = target / (profile + ".onnx")
              actual = (hashlib.sha256(model.read_bytes()).hexdigest()
                        if len(digest) == 64 else hashlib.md5(model.read_bytes()).hexdigest())
              if actual != digest:
                  raise SystemExit(f"Checksum mismatch for {profile}: {actual}")
              config = json.loads((target / (profile + ".onnx.json")).read_text())
              if config["language"]["code"].split("_")[0] != language:
                  raise SystemExit("Voice language mismatch: " + profile)
              if not config.get("phoneme_id_map") or config.get("num_speakers") != 1:
                  raise SystemExit("Unsupported Piper configuration: " + profile)
              print(profile, "verified:", model.stat().st_size, "bytes")
          PY

      - name: Bundle verified Supertonic 3 four-stage inference pack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'huggingface_hub>=0.30,<3'
          python3 tools/prepare_supertonic3_assets.py --output android/assets/models/supertonic3
          test -s android/assets/models/supertonic3/asset_manifest.json
          test -s android/assets/models/supertonic3/LICENSE
          test -s android/assets/models/supertonic3/onnx/vocoder.onnx
          python3 tools/audit_supertonic3_assets.py --directory android/assets/models/supertonic3

      - name: Bundle trained ECAPA speaker embedding checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'huggingface_hub>=0.30,<3' 'onnx>=1.16,<2'
          python3 - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          import hashlib, json, shutil, onnx
          repo = "Pawls2theWall/equivl-ecapa-voxceleb-onnx"
          info = HfApi().model_info(repo, revision="main")
          if info.cardData is None or info.cardData.get("license") != "apache-2.0":
              raise SystemExit("ECAPA redistribution license must be explicitly Apache-2.0")
          revision = info.sha
          directory = Path("android/assets/models/speaker")
          directory.mkdir(parents=True, exist_ok=True)
          source = Path(hf_hub_download(repo_id=repo, filename="model_fp16.onnx", revision=revision))
          destination = directory / "model.onnx"
          shutil.copyfile(source, destination)
          graph = onnx.load(str(destination), load_external_data=False).graph
          inputs = [item for item in graph.input if item.name not in {init.name for init in graph.initializer}]
          outputs = list(graph.output)
          if len(inputs) != 1 or len(outputs) != 1 or inputs[0].name != "waveform" or outputs[0].name != "embedding":
              raise SystemExit("Unexpected ECAPA model I/O names")
          def dimensions(tensor):
              return [dim.dim_value if dim.HasField("dim_value") else -1 for dim in tensor.type.tensor_type.shape.dim]
          if (len(dimensions(inputs[0])) != 2 or dimensions(inputs[0])[0] not in (1, -1) or dimensions(outputs[0]) not in ([192], [-1], [1, 192], [-1, 192])):
              raise SystemExit(f"ECAPA input/output shape changed: {dimensions(inputs[0])} -> {dimensions(outputs[0])}")
          import numpy as np
          import onnxruntime as ort
          session = ort.InferenceSession(str(destination), providers=["CPUExecutionProvider"])
          probe = session.run(["embedding"], {"waveform": np.zeros((1, 48000), dtype=np.float32)})[0]
          if probe.size != 192 or not np.isfinite(probe).all():
              raise SystemExit(f"ECAPA runtime embedding invalid: {probe.shape}")
          if destination.stat().st_size < 35_000_000:
              raise SystemExit("Speaker model incomplete")
          (directory / "LICENSE.txt").write_text("Apache-2.0; upstream " + repo + "; pinned revision " + revision + "\\n")
          # Thresholds are intentionally conservative starting values, pending
          # held-out dialogue calibration; never treat a green build as accuracy proof.
          manifest = dict(model_path="model.onnx", model_sha256=hashlib.sha256(destination.read_bytes()).hexdigest(),
              sample_rate=16000, input_name="waveform", output_name="embedding",
              embedding_dimension=192, input_samples=48000,
              preprocessing="raw_pcm16k_mono_float32", license_record="LICENSE.txt",
              match_threshold=0.20, new_speaker_threshold=0.40,
              calibration_status="pending_held_out_anime_dialogue")
          (directory / "manifest.json").write_text(json.dumps(manifest, indent=2))
          print("Bundled ECAPA model:", revision, manifest["model_sha256"])
          PY

      - name: Verify every required AI asset before APK build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          root = Path("android/assets/models")
          required = {
              "whisper.bin": 550000000,
              "otakumind.gguf": 1200000000,
              "separation.onnx": 1000000,
              "separation.json": 10,
              "speaker/model.onnx": 35000000,
              "speaker/manifest.json": 100,
              "speaker/LICENSE.txt": 30,
              "voices/hi_hero.onnx": 1000000,
              "voices/hi_hero.onnx.json": 100,
              "voices/en_hero.onnx": 1000000,
              "voices/en_hero.onnx.json": 100,
              "voices/hi_heroine.onnx": 1000000,
              "voices/hi_heroine.onnx.json": 100,
              "voices/en_young_male.onnx": 1000000,
              "voices/en_young_male.onnx.json": 100,
          }
          for name, minimum in required.items():
              path = root / name
              if not path.is_file() or path.stat().st_size < minimum:
                  raise SystemExit(f"REQUIRED ASSET MISSING OR TRUNCATED: {path}")
              print("PASS", name, path.stat().st_size)
          with (root / "otakumind.gguf").open("rb") as f:
              if f.read(4) != b"GGUF":
                  raise SystemExit("Invalid OtakuMind GGUF header")
          for name, expected in {
              "voices/hi_hero.onnx": "169964b0871667f6793416d4b35e97357a68ba1ad01df8580c28048989ee7693",
              "voices/en_hero.onnx": "99d1f6181a7f5ccbe3f117ba8ce63c93",
          }.items():
              if (hashlib.sha256((root / name).read_bytes()).hexdigest() if len(expected) == 64 else hashlib.md5((root / name).read_bytes()).hexdigest()) != expected:
                  raise SystemExit("Voice checksum mismatch: " + name)
          for name, language in [("hi_hero", "hi"), ("en_hero", "en")]:
              cfg = json.loads((root / "voices" / (name + ".onnx.json")).read_text())
              if cfg["language"]["code"].split("_")[0] != language:
                  raise SystemExit("Wrong language: " + name)
          print("ALL REQUIRED AI ASSETS VERIFIED")
          PY

      - name: Verify all required AI assets before APK compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("android/assets/models")
          required = {
              "whisper.bin": 550000000,
              "otakumind.gguf": 1200000000,
              "separation.onnx": 1000000,
              "separation.json": 10,
              "speaker/model.onnx": 35000000,
              "speaker/manifest.json": 100,
              "speaker/LICENSE.txt": 30,
              "voices/hi_hero.onnx": 1000000,
              "voices/hi_hero.onnx.json": 100,
              "voices/en_hero.onnx": 1000000,
              "voices/en_hero.onnx.json": 100,
              "voices/hi_heroine.onnx": 1000000,
              "voices/hi_heroine.onnx.json": 100,
              "voices/en_young_male.onnx": 1000000,
              "voices/en_young_male.onnx.json": 100,
          }
          for name, minimum in required.items():
              path = root / name
              if not path.is_file() or path.stat().st_size < minimum:
                  raise SystemExit(f"Required AI asset absent/incomplete: {path}")
              print("PRE-BUILD VERIFIED:", name, path.stat().st_size)
          with (root / "otakumind.gguf").open("rb") as stream:
              if stream.read(4) != b"GGUF":
                  raise SystemExit("Invalid OtakuMind GGUF signature")
          for language, profile in (("hi", "hi_hero"), ("en", "en_hero")):
              config = json.loads((root / "voices" / (profile + ".onnx.json")).read_text())
              if config["language"]["code"].split("_")[0] != language or not config.get("phoneme_id_map"):
                  raise SystemExit("Invalid voice configuration: " + profile)
          print("ALL REQUIRED AI ASSETS VERIFIED BEFORE COMPILATION")
          PY

      - name: Verify transcription language fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'lang == "unknown"' android/android/app/src/main/cpp/otakudub_whisper.cpp
          grep -q 'params.no_context = true' android/android/app/src/main/cpp/otakudub_whisper.cpp
          grep -q 'chunkSamples = 30 \* 16000' android/android/app/src/main/cpp/otakudub_whisper.cpp
          grep -q 'Decode directly into the inference buffer' android/android/app/src/main/cpp/otakudub_whisper.cpp

      - name: Install Flutter dependencies
        working-directory: android
        run: flutter pub get

      # Blackheart identity artwork is generated from original geometry, not copied branding.
      # Rebuild includes the restored five-second company and app introduction.
      # Validate the new stage-based video percentage and clarified engine library.
      - name: Create Blackheart OtakuDub launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow>=10,<13'
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          im = Image.new('RGB', (1024, 1024), (185, 162, 244))
          draw = ImageDraw.Draw(im)
          font_file = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for label, top, size in [('Otaku', 310, 180), ('Dub', 505, 220)]:
              font = ImageFont.truetype(font_file, size)
              width = draw.textlength(label, font=font)
              draw.text(((1024-width)/2, top), label, font=font, fill='white')
          draw.polygon([(785,220),(800,265),(845,280),(800,295),
                        (785,340),(770,295),(725,280),(770,265)], fill='white')
          path = Path('android/assets/otakudub_icon.png')
          im.save(path)
          # Adaptive icons need a transparent foreground and a separately
          # configured lavender background; keep artwork in the safe zone.
          foreground = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          foreground_draw = ImageDraw.Draw(foreground)
          for label, top, size in [('Otaku', 360, 125), ('Dub', 495, 155)]:
              font = ImageFont.truetype(font_file, size)
              width = foreground_draw.textlength(label, font=font)
              foreground_draw.text(((1024-width)/2, top), label, font=font, fill='white')
          foreground_draw.polygon([(700,335),(710,365),(740,375),(710,385),
                                   (700,415),(690,385),(660,375),(690,365)],fill='white')
          foreground_path = Path('android/assets/otakudub_icon_foreground.png')
          foreground.save(foreground_path)
          print('Lavender launcher icons ready:', path.stat().st_size, foreground_path.stat().st_size)
          PY

      - name: Generate launcher icon
        working-directory: android
        run: dart run flutter_launcher_icons

      - name: Verify custom launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          test -s android/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/android/app/src/main/AndroidManifest.xml

      - name: Configure Japanese branding
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Otaku Dub"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Android app label not found")

          manifest.write_text(content)
          PY

      - name: Verify Flutter installation
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

          test -s assets/models/whisper.bin

      - name: Run Flutter regression tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # flutter create generates a template test for MyApp, but OtakuDub
          # has its own app root and checked-in regression tests.
          if test -f test/widget_test.dart && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          flutter test

      - name: Verify speaker candidate is not production-enabled
        run: python3 -m unittest discover -s tools -p 'test_speaker_model_candidate.py'

      - name: Test speaker embedding calibration
        run: python3 -m unittest discover -s tools -p 'test_calibrate_speaker_embeddings.py'

      - name: Test native speaker feature validation
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Prepare persistent release signing
        shell: bash
        env:
          OTAKUDUB_KEYSTORE_BASE64: ${{ secrets.OTAKUDUB_KEYSTORE_BASE64 }}
          OTAKUDUB_STORE_PASSWORD: ${{ secrets.OTAKUDUB_STORE_PASSWORD }}
          OTAKUDUB_KEY_ALIAS: ${{ secrets.OTAKUDUB_KEY_ALIAS }}
          OTAKUDUB_KEY_PASSWORD: ${{ secrets.OTAKUDUB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in OTAKUDUB_KEYSTORE_BASE64 OTAKUDUB_STORE_PASSWORD OTAKUDUB_KEY_ALIAS OTAKUDUB_KEY_PASSWORD; do
            if test -z "${!variable}"; then
              echo "::error::Missing $variable GitHub Actions secret. Release signing is required; refusing an incompatible debug APK."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$OTAKUDUB_KEYSTORE_BASE64" | base64 --decode > android/android/otakudub-release.jks
          keytool -list -keystore android/android/otakudub-release.jks -storepass "$OTAKUDUB_STORE_PASSWORD" -alias "$OTAKUDUB_KEY_ALIAS" >/dev/null
          {
            printf 'storeFile=otakudub-release.jks\n'
            printf 'storePassword=%s\n' "$OTAKUDUB_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$OTAKUDUB_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$OTAKUDUB_KEY_PASSWORD"
          } > android/android/signing.properties
          echo "Persistent release keystore validated."

      - name: Build OtakuDub signed release APK
        working-directory: android
        run: flutter build apk --release

      - name: Verify release APK signing
        shell: bash
        run: |
          set -euo pipefail
          APK=android/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:'

      - name: Verify every required AI asset inside the built APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json
          apk = Path("android/build/app/outputs/flutter-apk/app-release.apk")
          required = {
              "assets/flutter_assets/assets/models/whisper.bin": 550000000,
              "assets/flutter_assets/assets/models/otakumind.gguf": 400000000,
              "assets/flutter_assets/assets/models/separation.onnx": 1000000,
              "assets/flutter_assets/assets/models/separation.json": 10,
              "assets/flutter_assets/assets/models/speaker/model.onnx": 35000000,
              "assets/flutter_assets/assets/models/speaker/manifest.json": 100,
              "assets/flutter_assets/assets/models/speaker/LICENSE.txt": 30,
              "assets/flutter_assets/assets/models/voices/hi_hero.onnx": 1000000,
              "assets/flutter_assets/assets/models/voices/hi_hero.onnx.json": 100,
              "assets/flutter_assets/assets/models/voices/en_hero.onnx": 1000000,
              "assets/flutter_assets/assets/models/voices/en_hero.onnx.json": 100,
              "assets/flutter_assets/assets/models/voices/hi_heroine.onnx": 1000000,
              "assets/flutter_assets/assets/models/voices/hi_heroine.onnx.json": 100,
              "assets/flutter_assets/assets/models/voices/en_young_male.onnx": 1000000,
              "assets/flutter_assets/assets/models/voices/en_young_male.onnx.json": 100,
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for name, minimum in required.items():
                  if name not in names:
                      raise SystemExit("REQUIRED APK ASSET MISSING: " + name)
                  info = archive.getinfo(name)
                  if info.file_size < minimum:
                      raise SystemExit(f"REQUIRED APK ASSET TOO SMALL: {name} ({info.file_size})")
                  with archive.open(name) as stream:
                      header = stream.read(4)
                  if name.endswith(".gguf") and header != b"GGUF":
                      raise SystemExit("Invalid bundled OtakuMind GGUF header")
                  print("VERIFIED:", name, info.file_size, "bytes")
              manifest = json.loads(archive.read("assets/flutter_assets/AssetManifest.json")) if "assets/flutter_assets/AssetManifest.json" in names else None
              print("All required AI assets physically present in APK.")
          PY

      - name: Verify all bundled Supertonic assets inside release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_supertonic3_assets.py --apk android/build/app/outputs/flutter-apk/app-release.apk

      - name: Verify required AI files are actually inside the APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("android/build/app/outputs/flutter-apk/app-release.apk")
          if not apk.is_file():
              raise SystemExit("APK missing")
          names = [
              "whisper.bin", "otakumind.gguf", "separation.onnx", "separation.json",
              "speaker/model.onnx", "speaker/manifest.json", "speaker/LICENSE.txt",
              "voices/hi_hero.onnx", "voices/hi_hero.onnx.json",
              "voices/en_hero.onnx", "voices/en_hero.onnx.json",
              "voices/hi_heroine.onnx", "voices/hi_heroine.onnx.json",
              "voices/en_young_male.onnx", "voices/en_young_male.onnx.json",
          ]
          with ZipFile(apk) as archive:
              for name in names:
                  entry = "assets/flutter_assets/assets/models/" + name
                  try:
                      info = archive.getinfo(entry)
                  except KeyError:
                      raise SystemExit("APK IS MISSING REQUIRED ASSET: " + entry)
                  if info.file_size < (400000000 if name == "otakumind.gguf" else 1):
                      raise SystemExit("APK ASSET INVALID: " + entry)
                  print("PACKAGED", entry, info.file_size)
              with archive.open("assets/flutter_assets/assets/models/otakumind.gguf") as model:
                  if model.read(4) != b"GGUF":
                      raise SystemExit("APK OtakuMind GGUF header invalid")
          print("APK ASSET AUDIT PASSED")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Signed-Release-APK-${{ github.sha }}
          compression-level: 0
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

