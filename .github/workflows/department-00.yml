name: Department 00 verification
on:
  push:
    branches: [feature/departmental-ai-pipeline]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore standard Flutter Android scaffold without overwriting application files
        working-directory: android
        run: |
          mkdir -p /tmp/otakudub_scaffold
          cd /tmp/otakudub_scaffold
          flutter create --platforms android --project-name ai_dubbing_studio --org co.parikshit .
          cd "$GITHUB_WORKSPACE/android"
          cp -an /tmp/otakudub_scaffold/android/. android/
          test -f android/settings.gradle.kts -o -f android/settings.gradle
          test -f android/gradlew
          chmod +x android/gradlew
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export genuine pretrained DINOv2 for offline APK provisioning
        run: |
          python -m pip install 'torch==2.5.1' 'torchvision==0.20.1' 'transformers==4.46.3' 'huggingface_hub==0.26.2' 'onnx==1.17.0' 'onnxruntime==1.20.1' 'numpy==1.26.4' 'onnxscript==0.1.0'
          MODEL_OUTPUT=android/assets/models python tools/acquire_dinov2.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('android/assets/models')
          manifest = json.loads((root / 'manifest.json').read_text())
          model = root / 'dinov2_small_cls.onnx'
          assert model.stat().st_size > 1000000, 'Genuine pretrained model missing'
          assert hashlib.sha256(model.read_bytes()).hexdigest() == manifest['sha256']
          assert manifest['onnx_cpu_equivalence_checked'] is True
          print('Bundled ONNX weights and provenance verified')
          PY
      - name: Dependencies
        working-directory: android
        run: flutter pub get
      - name: Generate branded OtakuDub Android launcher icons
        working-directory: android
        run: |
          test -s assets/otakudub_icon.png
          python3 -m pip install 'Pillow==11.3.0'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, UnidentifiedImageError
          source = Path('assets/otakudub_icon.png')
          try:
              with Image.open(source) as opened:
                  opened.verify()
              with Image.open(source) as opened:
                  icon = ImageOps.exif_transpose(opened)
                  icon.load()
                  width, height = icon.size
                  assert width == height and width >= 512, 'Launcher icon must be square and at least 512px'
                  assert width <= 4096, 'Launcher icon dimensions exceed limit'
                  icon.convert('RGBA').save(source, format='PNG', optimize=True)
          except (UnidentifiedImageError, OSError, ValueError) as exc:
              raise SystemExit(f'Invalid launcher image: {exc}')
          assert source.read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a'))
          print(f'Normalised branded launcher image to genuine PNG: {width}x{height}')
          PY
          dart run flutter_launcher_icons
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
      - name: Static analysis
        working-directory: android
        run: flutter analyze
      - name: Unit and widget tests
        working-directory: android
        run: flutter test --reporter expanded
      - name: Offline Department 01 benchmark regression tests
        run: python3 -m unittest discover -s tools -p 'test_*department01*.py' -v
      - name: Restore existing release signing key securely
        working-directory: android
        env:
          OTAKUDUB_KEYSTORE_BASE64: ${{ secrets.OTAKUDUB_KEYSTORE_BASE64 }}
          OTAKUDUB_KEY_ALIAS: ${{ secrets.OTAKUDUB_KEY_ALIAS }}
          OTAKUDUB_KEY_PASSWORD: ${{ secrets.OTAKUDUB_KEY_PASSWORD }}
          OTAKUDUB_STORE_PASSWORD: ${{ secrets.OTAKUDUB_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names = ('OTAKUDUB_KEYSTORE_BASE64', 'OTAKUDUB_KEY_ALIAS',
                   'OTAKUDUB_KEY_PASSWORD', 'OTAKUDUB_STORE_PASSWORD')
          if any(not os.environ.get(n) for n in names):
              raise SystemExit('Required release signing secret is absent')
          root = pathlib.Path('android')
          key = root / 'otakudub-release.jks'
          try:
              raw = base64.b64decode(''.join(os.environ[names[0]].split()), validate=True)
          except (ValueError, base64.binascii.Error):
              raise SystemExit('Invalid base64 keystore secret')
          if not raw:
              raise SystemExit('Empty release keystore')
          key.write_bytes(raw)
          key.chmod(0o600)
          def prop(value):
              if any(c in value for c in (chr(10), chr(13))):
                  raise SystemExit('Signing secret contains unsupported newline')
              return ''.join(chr(92) + c if c in (chr(92), '=', ':', '#', ' ', '!') else c for c in value)
          props = {
              'storeFile': 'otakudub-release.jks',
              'storePassword': os.environ[names[3]],
              'keyAlias': os.environ[names[1]],
              'keyPassword': os.environ[names[2]],
          }
          target = root / 'signing.properties'
          target.write_text(chr(10).join(f'{k}={prop(v)}' for k, v in props.items()) + chr(10))
          target.chmod(0o600)
          PY
      - name: Build permanently signed release APK
        working-directory: android
        run: flutter build apk --release
      - name: Verify signed release APK identity
        working-directory: android
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOL="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$TOOL"
          "$TOOL" verify --verbose --print-certs "$APK" | grep -E 'Verified using|Signer #1 certificate SHA-256 digest'
          sha256sum "$APK"
      - name: Remove temporary signing material
        if: always()
        working-directory: android
        run: rm -f android/otakudub-release.jks android/signing.properties
      - name: Publish signed update APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Signed-Release-${{ github.sha }}
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Build debug APK
        working-directory: android
        run: flutter build apk --debug
      - name: Publish verification APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakuDub-Department-00-Verification-${{ github.sha }}
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
