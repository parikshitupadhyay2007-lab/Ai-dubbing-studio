name: Acquire Department 01 pretrained person detector
on:
  workflow_dispatch:
  push:
    branches: [feature/departmental-ai-pipeline]
    paths:
      - 'tools/acquire_department01_detector.py'
      - '.github/workflows/acquire-department01-detector.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' 'torchvision==0.20.1' 'transformers==4.46.3' 'huggingface_hub==0.26.2' 'onnx==1.17.0' 'onnxruntime==1.20.1' 'numpy==1.26.4' 'onnxscript==0.1.0' 'timm==1.0.11'
      - name: Download actual pretrained weights and check ONNX parity
        run: python tools/acquire_department01_detector.py
      - name: Upload ONNX and verified model manifest
        uses: actions/upload-artifact@v4
        with:
          name: Department01-DETR-Person-ONNX
          path: model_artifacts/
          retention-days: 7
          if-no-files-found: error
