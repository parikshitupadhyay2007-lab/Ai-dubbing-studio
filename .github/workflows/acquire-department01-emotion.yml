name: Acquire Department 01 pretrained dialogue emotion model
on:
  workflow_dispatch:
  push:
    branches: [feature/departmental-ai-pipeline]
    paths:
      - 'tools/acquire_department01_text_emotion.py'
      - '.github/workflows/acquire-department01-emotion.yml'
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' 'transformers==4.46.3' 'huggingface_hub==0.26.2' 'onnx==1.17.0' 'onnxruntime==1.20.1' 'numpy==1.26.4' 'onnxscript==0.1.0'
      - name: Export genuine pretrained classifier and verify ONNX parity
        run: python tools/acquire_department01_text_emotion.py
      - name: Upload model, tokenizer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Department01-Dialogue-Emotion-ONNX
          path: model_artifacts/
          retention-days: 7
          if-no-files-found: error
